<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>R34 Drive — Browser Demo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111e;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff}canvas{display:block;position:fixed;inset:0;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.glass{background:rgba(5,13,25,.65);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px);border-radius:16px;padding:11px 14px;box-shadow:0 8px 30px #0003}.brand{font-weight:900;letter-spacing:1px}.sub{font-size:11px;color:#a8c0d7;margin-top:2px}.speed{font-size:25px;font-weight:900;font-variant-numeric:tabular-nums}.unit{font-size:10px;color:#9bb1c7;letter-spacing:1px}.hint{position:absolute;top:90px;left:50%;transform:translateX(-50%);font-size:12px;color:#d7e4ef;white-space:nowrap;background:#06111c88;padding:7px 12px;border-radius:99px}.controls{position:absolute;bottom:20px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:end;pointer-events:auto}.cluster{display:flex;gap:10px;align-items:center}.btn{width:64px;height:64px;border-radius:20px;border:1px solid #ffffff45;background:linear-gradient(145deg,#ffffff27,#ffffff0d);color:white;font-size:24px;font-weight:800;box-shadow:0 8px 24px #0005;touch-action:none;user-select:none;-webkit-user-select:none}.btn:active,.btn.active{background:#43b7ff75;border-color:#a5e1ff}.pedal{width:72px;height:76px;border-radius:20px;font-size:14px;letter-spacing:.5px}.brake{background:linear-gradient(145deg,#ff686844,#ad1b2533)}.note{position:absolute;bottom:112px;left:50%;transform:translateX(-50%);font-size:10px;color:#c2d2e2;white-space:nowrap;text-shadow:0 2px 5px #000}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#07111e;z-index:4;text-align:center;padding:24px}.loading strong{font-size:22px}.loading small{display:block;color:#9bb1c7;margin-top:8px}.hide{display:none!important}@media(max-width:480px){.btn{width:58px;height:58px;border-radius:18px}.pedal{width:64px;height:70px}.hint{top:86px}.top{top:12px;left:12px;right:12px}.glass{padding:9px 11px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div class="loading" id="loading"><div><strong>R34 DRIVE</strong><small>Loading your Nissan Skyline model…</small></div></div>
<div id="hud"><div class="top"><div class="glass"><div class="brand">R34 <span style="color:#4dc5ff">DRIVE</span></div><div class="sub">BROWSER DRIVING DEMO</div></div><div class="glass" style="text-align:right"><div class="speed"><span id="speed">0</span></div><div class="unit">KM/H · SPEED</div></div></div><div class="hint" id="hint">Hold ▲ to drive · ◀ ▶ to steer</div><div class="controls"><div class="cluster"><button class="btn" data-key="left" aria-label="Steer left">◀</button><button class="btn" data-key="right" aria-label="Steer right">▶</button></div><div class="cluster"><button class="btn pedal brake" data-key="brake">BRAKE</button><button class="btn pedal" data-key="gas" style="background:linear-gradient(145deg,#27d99b55,#0c745a44)">▲<br>GAS</button></div></div><div class="note">Keyboard: ↑ accelerate · ↓ brake/reverse · ← → steer · R reset</div></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const loading=document.getElementById('loading');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x8bb8d9); scene.fog=new THREE.Fog(0x8bb8d9,45,180);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,400); camera.position.set(0,4.2,9);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.7)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15; document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe3f4ff,0x34404b,2.0)); const sun=new THREE.DirectionalLight(0xfff0d8,3.1); sun.position.set(-8,15,7); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024); scene.add(sun);
// Road and simple roadside scenery
const roadMat=new THREE.MeshStandardMaterial({color:0x292f37,roughness:.92}); const road=new THREE.Mesh(new THREE.PlaneGeometry(12,240),roadMat); road.rotation.x=-Math.PI/2; road.position.set(0,-.04,-75); road.receiveShadow=true; scene.add(road);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({color:0x55775a,roughness:1})); ground.rotation.x=-Math.PI/2; ground.position.y=-.12; scene.add(ground);
const markings=[]; const markMat=new THREE.MeshBasicMaterial({color:0xf4f0d9}); for(let z=-190;z<25;z+=8){const m=new THREE.Mesh(new THREE.PlaneGeometry(.16,3.5),markMat);m.rotation.x=-Math.PI/2;m.position.set(0,.005,z);scene.add(m);markings.push(m)}
const edgeMat=new THREE.MeshBasicMaterial({color:0xd6dce0}); for(const x of [-5.4,5.4]){const e=new THREE.Mesh(new THREE.PlaneGeometry(.12,240),edgeMat);e.rotation.x=-Math.PI/2;e.position.set(x,.004,-75);scene.add(e)}
const posts=[]; for(let z=-190;z<25;z+=12){for(const x of [-7,7]){const p=new THREE.Group();const pole=new THREE.Mesh(new THREE.CylinderGeometry(.07,.09,1.5,6),new THREE.MeshStandardMaterial({color:0xe5e9eb}));pole.position.y=.75;p.add(pole);const cap=new THREE.Mesh(new THREE.BoxGeometry(.24,.22,.16),new THREE.MeshStandardMaterial({color:0x2e94ce,emissive:0x12344a}));cap.position.y=1.48;p.add(cap);p.position.set(x,0,z);scene.add(p);posts.push(p)}}
let car=new THREE.Group(),carRoot=new THREE.Group(); scene.add(carRoot); carRoot.add(car); let wheelGroups=[]; let loaded=false; let carLength=4.5;
new GLTFLoader().load('./model/brians_r34_from_2_fast_2_furious.glb',g=>{const model=g.scene; const box=new THREE.Box3().setFromObject(model); const size=box.getSize(new THREE.Vector3()); const center=box.getCenter(new THREE.Vector3()); model.position.sub(center); const scale=4.4/Math.max(size.x,size.z); model.scale.setScalar(scale); car.add(model); const b2=new THREE.Box3().setFromObject(model); model.position.y-=b2.min.y; carLength=Math.max(size.z*scale,3.5); model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;} if(o.name && /3DWheel (Front|Rear) [LR]/i.test(o.name)){wheelGroups.push(o)}}); // Model forward axis: default assumes front points toward -Z
car.rotation.y=Math.PI; carRoot.position.set(0,0,0); loaded=true; loading.classList.add('hide');},undefined,e=>{console.error(e);loading.innerHTML='<div><strong>Model could not load</strong><small>Open this project through a web server with internet access, then retry.</small></div>'});
const keys={left:false,right:false,gas:false,brake:false}; let speed=0,steer=0,heading=0,roadTravel=0; const maxSpeed=38;
function bindButton(b){const k=b.dataset.key; const down=e=>{e.preventDefault();keys[k]=true;b.classList.add('active');try{b.setPointerCapture(e.pointerId)}catch{}};const up=e=>{e.preventDefault();keys[k]=false;b.classList.remove('active')};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',()=>{keys[k]=false;b.classList.remove('active')})} document.querySelectorAll('[data-key]').forEach(bindButton);
const keyMap={'ArrowLeft':'left','a':'left','ArrowRight':'right','d':'right','ArrowUp':'gas','w':'gas','ArrowDown':'brake','s':'brake',' ':'brake'};addEventListener('keydown',e=>{if(keyMap[e.key]){keys[keyMap[e.key]]=true;e.preventDefault()}if(e.key.toLowerCase()==='r'){speed=0;steer=0;heading=0;carRoot.position.x=0;carRoot.rotation.y=0}});addEventListener('keyup',e=>{if(keyMap[e.key])keys[keyMap[e.key]]=false});
const clock=new THREE.Clock(); const target=new THREE.Vector3();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04); if(loaded){if(keys.gas)speed=Math.min(maxSpeed,speed+dt*14);else speed=Math.max(0,speed-dt*4.2);if(keys.brake)speed=Math.max(-8,speed-dt*24);const steerInput=(keys.left?1:0)-(keys.right?1:0);steer=THREE.MathUtils.damp(steer,steerInput,5,dt);heading+=steer*dt*(speed/ maxSpeed)*.95;carRoot.position.x=THREE.MathUtils.clamp(carRoot.position.x+steer*dt*(speed*.19),-4.2,4.2);carRoot.rotation.y=-heading*.28;car.position.y=Math.sin(clock.elapsedTime*12)*Math.min(speed/100,.035);roadTravel+=speed*dt*.9;for(const m of markings){m.position.z+=speed*dt*.95;if(m.position.z>8)m.position.z-=216}for(const p of posts){p.position.z+=speed*dt*.95;if(p.position.z>8)p.position.z-=216}wheelGroups.forEach(w=>{w.rotation.x+=speed*dt*.7});document.getElementById('speed').textContent=Math.round(Math.abs(speed)*5.5);}
const camTarget=new THREE.Vector3(carRoot.position.x*.55,1.0,0); const camPos=new THREE.Vector3(carRoot.position.x*.72,4.1,9.5); camera.position.lerp(camPos,1-Math.exp(-3*dt));target.lerp(camTarget,1-Math.exp(-4*dt));camera.lookAt(target);renderer.render(scene,camera)} animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
